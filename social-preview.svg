<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient matching the site theme -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>

  <!-- Main title -->
  <text x="640" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="72" font-weight="700" fill="white" text-anchor="middle">
    Jujutsu VCS Tutorial
  </text>

  <!-- Subtitle -->
  <text x="640" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="32" font-weight="400" fill="white" text-anchor="middle" opacity="0.95">
    Learn Modern Version Control
  </text>

  <!-- Features list -->
  <g transform="translate(640, 360)">
    <!-- Feature 1 -->
    <g transform="translate(-250, 0)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
      <text x="20" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="24" font-weight="500" fill="white" opacity="0.95">
        Interactive Tutorial
      </text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(-250, 60)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
      <text x="20" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="24" font-weight="500" fill="white" opacity="0.95">
        Knowledge Tests
      </text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(-250, 120)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.9"/>
      <text x="20" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="24" font-weight="500" fill="white" opacity="0.95">
        Command Reference
      </text>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="640" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="400" fill="white" text-anchor="middle" opacity="0.85">
    Git with a better workflow · Automatic rebasing · First-class conflicts
  </text>
</svg>
