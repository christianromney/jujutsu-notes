<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu VCS Advanced Test</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="container">
        <h1>Jujutsu VCS Advanced Test</h1>
        <p class="subtitle">Test your knowledge of advanced Jujutsu features and workflows</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="questionsContainer"></div>

        <div class="results" id="results">
            <div class="score" id="score"></div>
            <div class="score-message" id="scoreMessage"></div>
            <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
                <button onclick="restartQuiz()" class="restart-button">Re-test This Level</button>
                <button onclick="window.location.href='index.html'" class="restart-button secondary">Back to Tests</button>
            </div>
            <div class="answer-review" id="answerReview"></div>
        </div>

        <div class="navigation" id="navigation">
            <button onclick="previousQuestion()" id="prevBtn" class="secondary">Previous</button>
            <button onclick="nextQuestion()" id="nextBtn">Next</button>
        </div>
    </div>

    <script>
        // Question Bank - 30 questions organized by category
        const questionBank = [
            // ===== CATEGORY: Power Features (8 questions) =====
            {
                category: "power-features",
                question: "What does 'jj absorb' do?",
                options: [
                    "Combines all commits into one",
                    "Intelligently distributes working copy changes to the commits that last touched each line",
                    "Deletes empty commits from history",
                    "Imports changes from a Git repository"
                ],
                correct: 1
            },
            {
                category: "power-features",
                question: "What is 'jj diffedit' used for?",
                options: [
                    "Editing commit messages",
                    "Resolving conflicts",
                    "Interactively editing the changes in a commit using a diff editor",
                    "Comparing two files"
                ],
                correct: 2
            },
            {
                category: "power-features",
                question: "What does 'jj parallelize <revset>' do?",
                options: [
                    "Speeds up jj operations by using multiple threads",
                    "Converts a linear stack of commits into parallel siblings",
                    "Runs multiple commands simultaneously",
                    "Creates parallel branches"
                ],
                correct: 1
            },
            {
                category: "power-features",
                question: "What does 'jj duplicate <change-id>' do?",
                options: [
                    "Creates a backup of the repository",
                    "Creates a copy of a commit with the same content but different change ID",
                    "Duplicates a file in the working copy",
                    "Creates a new branch"
                ],
                correct: 1
            },
            {
                category: "power-features",
                question: "What does 'jj bisect run <command>' do?",
                options: [
                    "Runs a command on all commits",

                    "Splits a commit based on the command output",

                ],
                correct: 1

            {
                category: "power-features",
                question: "When would you use 'jj duplicate' instead of 'jj new'?",
                options: [
                    "When you want to create an empty commit",

                    "When you want to create a bookmark",
                    "When you want to merge commits"
                ],
                correct: 1
            },
            {
                category: "power-features",
                question: "What does 'jj fix' do?",
                options: [
                    "Fixes merge conflicts",
                    "Applies configured formatters/linters to commits",
                    "Repairs corrupted repository",
                    "Fixes commit messages"
                ],
                correct: 1
            },
            {
                category: "power-features",
                question: "Can 'jj absorb' distribute changes to immutable commits?",
                options: [
                    "Yes, to all commits",

                    "Yes, but only to trunk commits"
                ],
                correct: 1
            },

            // ===== CATEGORY: Operations and Time Travel (8 questions) =====
            {
                category: "operations",
                question: "What is the purpose of 'jj op log'?",
                options: [
                    "Shows all commits in the repository",
                    "Displays operation history of all jj commands run",
                    "Lists all open operations",
                    "Shows the Git log"
                ],
                correct: 1
            },
            {
                category: "operations",
                question: "What does 'jj op restore <operation-id>' do?",
                options: [
                    "Restores deleted files",

            {
                category: "operations",

                correct: 1

            {
                category: "operations",
                question: "How far back does the operation log go?",

                    "Only the current session",
                    "Last 7 days by default",

                    "Last 100 operations"

                correct: 2
            },
            {
                category: "operations",

                    "Common changes in both commits"

                correct: 1
            },

                category: "revsets",
                question: "What does the revset 'main..@' select?",

                ],
                correct: 1
            },
            {
                category: "revsets",
                question: "What does the revset function 'author(alice)' match?",

                    "Commits where alice is mentioned",

                    "Commits assigned to alice"

                correct: 1
            },

                category: "revsets",

                    "You must abandon the stack"

                correct: 2
            },

                category: "workflows",

                ],
                correct: 1
            },
            {
                category: "workflows",

                    "When you want to delete half of a commit",

                    "When you want to create a backup",
                    "When resolving conflicts"

            {
                category: "workflows",

                    "It makes pushes faster",

                ],
                correct: 1
            },
            {
                category: "workflows",
                question: "How can you view what changed in a file across different revisions?",
                options: [
                    "jj file diff <path>",
                    "jj file show <path> -r <rev1> and jj file show <path> -r <rev2>",
                    "jj compare <rev1> <rev2> <path>",
                    "jj file history <path>"
                ],
                correct: 1
            }
        ];
    </script>
    <script src="quiz.js"></script>
</body>
</html>
